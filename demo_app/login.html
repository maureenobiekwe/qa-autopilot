<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Shop - Sign in</title>
</head>
<body>
  <h1>Sign in</h1>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" placeholder="Username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Password">
    <button id="login-button" type="submit">Log in</button>
  </form>
  <p id="error" role="alert" hidden>Invalid username or password</p>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var ok = document.getElementById('username').value === 'demo_user' &&
               document.getElementById('password').value === 'demo_pass';
      if (ok) { sessionStorage.setItem('signed_in', '1'); location.href = 'shop.html'; }
      else { document.getElementById('error').hidden = false; }
    });
  </script>
</body>
</html>
